name: Build local-release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test, build and verify (no public publishing)
        run: make release-local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disklens-local-release
          path: |
            dist/*.dmg
            dist/*-source.zip
            dist/SHA256SUMS
            dist/homebrew-tap/Casks/disk-lens.rb
          if-no-files-found: error
